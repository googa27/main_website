# Use the same installed API and pinned workspace tools as CI.
# Activate the API dev environment and run corepack pnpm install first.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (declared API policy)
        language: system
        entry: ruff check --fix
        files: ^apps/api/
        types: [python]
      - id: ruff-format
        name: Ruff format (declared API policy)
        language: system
        entry: ruff format
        files: ^apps/api/
        types: [python]
      - id: mypy
        name: Mypy (API environment and project config)
        language: system
        entry: corepack pnpm --filter api typecheck
        files: ^apps/api/
        pass_filenames: false
      - id: eslint
        name: ESLint (installed workspace)
        language: system
        entry: corepack pnpm --filter web lint
        files: ^(apps/web/|packages/config/)
        pass_filenames: false
      - id: prettier
        name: Prettier (installed workspace)
        language: system
        entry: corepack pnpm exec prettier --write
        files: ^(apps/web/|packages/ui/)
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, yaml]
