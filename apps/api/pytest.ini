[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
filterwarnings =
    error::DeprecationWarning
    error::starlette.exceptions.StarletteDeprecationWarning
    # Starlette 1.6.0 imports an alias deprecated by AnyIO 4.15; remove when upstream fixes the import.
    ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:starlette\.testclient
