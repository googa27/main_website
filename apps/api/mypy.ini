[mypy]
# Setuptools generates a duplicate source tree when building the API artifact.
exclude = ^build/
ignore_missing_imports = True

[mypy-app.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

# New export boundaries are checked despite legacy broad API exclusions.
[mypy-app.schemas.resume,app.services.cv.resume,app.services.cv.pdf,app.services.cv.projects,app.services.cv.export]
ignore_errors = False
check_untyped_defs = True
