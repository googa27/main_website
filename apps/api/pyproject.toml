[project]
name = "portfolio-api"
version = "0.1.0"
description = "FastAPI backend service for the portfolio website"
authors = [{ name = "Portfolio Maintainers" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.43",
    "psycopg2-binary==2.9.10",
    "alembic==1.18.5",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "email-validator==2.3.0",
    "python-multipart==0.0.32",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "idna==3.18",
    "Mako==1.3.12",
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
pdf = ["reportlab==5.0.1", "pillow==12.3.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx2==2.12.0",
    "black==26.3.1",
    "ruff==0.16.0",
    "Pygments==2.20.0",
    "types-requests==2.32.4.20250809",
    "mypy==1.17.1",
    "pypdf==6.18.1",
]

[project.scripts]
portfolio-cv = "app.services.cv.export:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
# Preserve established correctness checks and explicitly adopt focused modernization
# and async/mutable-default checks, independent of changing Ruff defaults.
select = ["E4", "E7", "E9", "F", "I", "UP", "B006", "B008", "RUF012", "RUF013", "ASYNC210", "ASYNC230"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends objects declare dependency injection; they are not request state.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Preserve public str(EnumMember) compatibility until an explicit API migration.
"app/schemas/cv.py" = ["UP042"]
"app/schemas/project.py" = ["UP042"]

[tool.setuptools.package-data]
app = ["static/cv/*.json", "static/schemas/*.json", "static/schemas/*.md"]
