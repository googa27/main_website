name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency build policy
        run: pnpm run check:dependency-build-policy

      - name: Lint frontend
        run: pnpm --filter web lint

      - name: Type check frontend
        run: pnpm --filter web typecheck

      - name: Check frontend formatting
        run: pnpm exec prettier --check apps/web packages/ui

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev,pdf]"

      - name: Lint backend
        working-directory: apps/api
        run: |
          ruff check .
          mypy .

      - name: Format check backend
        working-directory: apps/api
        run: ruff format --check .

      - name: Build frontend
        run: pnpm --filter web build

      - name: Verify installed API artifact
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/api-wheels" apps/api
          python -m venv "$RUNNER_TEMP/api-wheel-env"
          "$RUNNER_TEMP/api-wheel-env/bin/python" -m pip install "$RUNNER_TEMP"/api-wheels/portfolio_api-*.whl
          python scripts/check_installed_api.py --python "$RUNNER_TEMP/api-wheel-env/bin/python"

  test:
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency build policy
        run: pnpm run check:dependency-build-policy

      - name: Run frontend tests
        run: pnpm --filter web test

      - name: Run backend tests
        working-directory: apps/api
        run: |
          python -m pip install -e ".[dev,pdf]"
          pytest

      - name: Run repository architecture tests
        run: |
          python -m pip install -r requirements-architecture.txt pytest
          pytest tests/architecture

  security:
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run backend dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r apps/api/requirements.txt
          pip-audit -r apps/api/requirements-dev.txt
          pip-audit -r apps/api/requirements-pdf.txt

  osv-pr-scan:
    if: ${{ github.event_name == 'pull_request' }}
    needs: quality-checks
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write

  osv-full-scan:
    if: ${{ github.event_name == 'push' }}
    needs: quality-checks
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
